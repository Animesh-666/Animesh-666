name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-profile-stats.yml'
      - 'scripts/refresh_profile_stats.py'

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate cards from public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_profile_stats.py

      - name: Commit latest cards if changed
        run: |
          git add assets/github-stats.svg assets/github-languages.svg
          if git diff --cached --quiet; then
            echo 'Stats are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public GitHub statistics cards'
          git push
